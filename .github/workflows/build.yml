name: Build Forge mod

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        run: bash gradlew --no-daemon build
      - name: Start dedicated server
        run: bash scripts/smoke-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: villagerking-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
