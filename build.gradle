plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    reobf = true
    runs {
        client {
            workingDirectory project.file('run')
            mods { villagerking { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { villagerking { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation fg.deobf("maven.modrinth:epic-fight:${project.epicfight_version}")
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest { attributes('Implementation-Title': project.name, 'Implementation-Version': project.version) }
    finalizedBy 'reobfJar'
}
